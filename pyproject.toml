[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "resume-analyzer"
version = "0.1.0"
description = "Evidence-backed resume-vs-JD screening support for the Hoysala Bank 2026-Q3 hiring round"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Abbas Ali Pansary" }]
keywords = ["resume", "screening", "structured-extraction", "llm", "hr-tech"]
dependencies = [
    # Runtime deps of the vendored llm_gateway package (see src/llm_gateway/).
    # Later milestones add their own here as they land (M3: pdfplumber,
    # M5: sentence-transformers, M7: streamlit) — the history shows the growth.
    "httpx>=0.27",
    "pydantic>=2.7",
    "typer>=0.12",
    "rich>=13.0",
    "tzdata; platform_system == 'Windows'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "ruff>=0.5",
]

[project.scripts]
llm-gateway = "llm_gateway.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/resume_analyzer", "src/llm_gateway"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
# The vendored gateway is lint-clean upstream and stays byte-identical here.
extend-exclude = ["src/llm_gateway"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.coverage.run]
# Scope: the resume_analyzer package. The vendored llm_gateway is covered by its
# own 80-test suite upstream; the Streamlit script (M7) is visual/manual surface.
source = ["src/resume_analyzer"]
omit = ["src/resume_analyzer/ui/*"]

[tool.coverage.report]
show_missing = true
precision = 1

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: tests that hit real provider APIs (deselected by default; run with -m live)",
    "models: tests that download local embedding models (deselected by default; run with -m models)",
]
addopts = "-m 'not live and not models'"
